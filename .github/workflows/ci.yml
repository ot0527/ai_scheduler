name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build core
        run: pnpm --filter @ai-scheduler/core build

      - name: Typecheck web
        run: pnpm --filter @ai-scheduler/web typecheck

      - name: Test
        run: pnpm --filter @ai-scheduler/core test
